<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Criar conta | Envio Fácil</title>
  <link rel="stylesheet" href="cadastro.css">
</head>
<body>
<div class="container">
  <h1>Criar sua conta</h1>
  <p>Plano mensal: <strong>R$ 29,99</strong></p>

  <form id="formCadastro">
    <input type="text" id="nome" placeholder="Seu nome" required />
    <input type="email" id="email" placeholder="Seu e-mail" required />
    <input type="password" id="senha" placeholder="Crie uma senha" required />
    <button type="submit">Criar conta</button>
  </form>

  <div id="pagamento" style="display:none; margin-top:20px;">
    <h2>Finalize o pagamento</h2>
    <div id="pixBox" style="display:none;"></div>
    <p id="pixStatus"></p>
  </div>

  <p id="status"></p>
</div>

<script src="cadastro.js"></script>
</body>
</html>
